[package]
name = "partybox-shell"
version = "0.1.0"
description = "Kiosk shell for PartyBox: a fullscreen webview pointed at a URL"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux only: the webcam needs WebKitGTK's media stream switched on and its
# permission request answered by us (see allow_camera in main.rs). Same
# version Tauri/wry already pull in, so no second copy gets built.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_4"] }

[profile.release]
# Small, fast binary: this only ever runs on the kiosk itself.
lto = true
codegen-units = 1
opt-level = "s"
strip = true
